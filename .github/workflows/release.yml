name: Release

# Push a tag that matches lib/waffo/pancake/version.rb (v0.1.0) to publish. RubyGems trusted
# publishing must be set up for this repository and workflow first (README → Development).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
      - name: Check the tag matches the version
        run: test "v$(ruby -Ilib -rwaffo/pancake/version -e 'print Waffo::Pancake::VERSION')" = "$GITHUB_REF_NAME"
      - uses: rubygems/release-gem@v1
