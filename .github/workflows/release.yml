name: Release

# Publishes the version in lib/waffo/pancake/version.rb to RubyGems through trusted publishing.
# Either push a tag that matches it (v0.2.0), or run this workflow by hand on main: then
# `rake release` creates and pushes the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: test "v$(ruby -Ilib -rwaffo/pancake/version -e 'print Waffo::Pancake::VERSION')" = "$GITHUB_REF_NAME"
      - uses: rubygems/release-gem@v1
