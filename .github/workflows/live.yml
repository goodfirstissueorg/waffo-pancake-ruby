name: Live API

# Uses real credentials, so it has no pull_request trigger: code from a fork or an open branch must
# never run with these secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Two runs at once would race on the temporary stores and on the gateway's rate limit.
concurrency:
  group: live-api

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:live
        env:
          WAFFO_LIVE: "1"
          WAFFO_ENVIRONMENT: test
          WAFFO_MERCHANT_ID: ${{ secrets.WAFFO_MERCHANT_ID }}
          WAFFO_PRIVATE_KEY: ${{ secrets.WAFFO_PRIVATE_KEY }}
          WAFFO_STORE_ID: ${{ secrets.WAFFO_STORE_ID }}
